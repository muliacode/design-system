name: Release

# Tag format: <package-name>@<version>, e.g.
#   @muliacode/tokens@2.2.0
#   @muliacode/tokens-tailwind@2.2.0
# The workflow derives which workspace to publish from the tag itself, so
# one workflow covers every package without hardcoding a package name.
on:
  push:
    tags:
      - '@muliacode/tokens@*'
      - '@muliacode/tokens-tailwind@*'

permissions:
  contents: read
  id-token: write   # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5, which is newer than what
      # some Node 22 builds bundle by default.
      - run: npm install -g npm@latest
      - run: npm --version

      - name: Resolve package and version from the tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG%@*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*@}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        run: |
          DIR=$(node -p "'${{ steps.pkg.outputs.name }}' === '@muliacode/tokens' ? 'tokens' : 'tokens-tailwind'")
          PKG_VERSION=$(node -p "require('./packages/'+process.argv[1]+'/package.json').version" "$DIR")
          if [ "$PKG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.pkg.outputs.version }} but package.json says $PKG_VERSION. Fix one and re-tag."
            exit 1
          fi

      # tokens-tailwind's own test (verify.mjs) reads packages/tokens/dist,
      # so tokens must be built first regardless of which one is tagged.
      - run: npm run build -w @muliacode/tokens

      - name: Test
        run: npm test -w "${{ steps.pkg.outputs.name }}"

      # No NODE_AUTH_TOKEN. Trusted publishing authenticates this exact
      # workflow file + repository against npm over OIDC — see the
      # one-time setup in packages/*/README.md before the first tagged
      # release of a package. npm attaches provenance automatically.
      - name: Publish
        run: npm publish -w "${{ steps.pkg.outputs.name }}"
