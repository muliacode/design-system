name: Release

# Tag format: @muliacode/ui@<version>, for example @muliacode/ui@0.1.0.
# The tag must match packages/ui/package.json, and CHANGELOG.md must have a
# section for that version. v1 packages are released from the v1 branch.
on:
  push:
    tags:
      - '@muliacode/ui@*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME##*@}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::The tag says ${{ steps.version.outputs.version }} but package.json says $PACKAGE_VERSION. Fix one and tag again."
            exit 1
          fi

      - name: Extract the changelog section
        run: node packages/ui/scripts/changelog-section.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - run: npm ci
      - run: npm run build -w @muliacode/ui
      - run: npm test -w @muliacode/ui

      # With trusted publishing set up on npmjs.com, no token is needed: npm
      # authenticates this workflow over OIDC. Until then (npm only allows it
      # once the package exists), the first release uses an NPM_TOKEN secret.
      # Either way the package gets a provenance statement.
      - name: Publish to npm
        run: npm publish -w @muliacode/ui --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
