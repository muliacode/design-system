name: CI

on:
  push: { branches: [main] }
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      # Until packages/ui lands (#3) there is no workspace to build, and npm
      # fails on --workspaces with none.
      - name: Check for packages
        id: packages
        run: |
          if ls packages/*/package.json > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.packages.outputs.present == 'true'
        run: npm ci
      - if: steps.packages.outputs.present == 'true'
        run: npm run build
      - if: steps.packages.outputs.present == 'true'
        run: npm test
      - if: steps.packages.outputs.present == 'true'
        run: npm run typecheck -w @muliacode/ui
      - if: steps.packages.outputs.present == 'true'
        name: Build Storybook
        run: npm run build-storybook -w @muliacode/ui
