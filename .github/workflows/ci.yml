name: CI

on:
  push: { branches: [main] }
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - run: npm ci
      - run: npm run build -w @muliacode/ui
      - run: npm test -w @muliacode/ui
