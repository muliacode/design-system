name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  tokens:
    name: Build & validate tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Build tokens
        run: npm run build -w @muliacode/tokens

      # The generated output is committed so consumers can read the diff of a
      # palette change in the PR. If the build produces something different
      # from what was committed, the author forgot to run it.
      - name: Check generated output is current
        run: |
          if [ -n "$(git status --porcelain packages/tokens/dist)" ]; then
            echo "::error::dist/ is stale. Run 'npm run build -w @muliacode/tokens' and commit."
            git --no-pager diff --stat packages/tokens/dist
            exit 1
          fi

      # Fails the build if any declared pairing drops below its WCAG threshold.
      - name: Validate contrast
        run: npm run validate

  a11y:
    name: Styleguide accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      # Playwright manages its own browser binary, so this doesn't depend on
      # matching a ChromeDriver version to whatever Chrome the runner image
      # ships this week.
      - run: npx playwright install --with-deps chromium

      - run: node scripts/check-a11y.mjs docs/design-system.html
