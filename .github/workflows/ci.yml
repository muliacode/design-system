name: CI

on:
  push: { branches: [main] }
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }

      - run: npm ci
      - run: npm run build
      - name: Install Chromium for the theme's scheme test
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck -w @muliacode/ui
      - name: Build Storybook
        run: npm run build-storybook -w @muliacode/ui
