<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mulia Code mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Canonical mark: kencana gold square, one unbroken stroke folding
       down and back up — a valley, not a peak. Fixed colors (not theme
       tokens) because a brand mark should read the same everywhere:
       favicons, npm badges, social previews, app icons. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#E5B653"/>
  <path d="M34 90V41l30 30 30-30v49"
        fill="none" stroke="#0C0B0A" stroke-width="9.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
