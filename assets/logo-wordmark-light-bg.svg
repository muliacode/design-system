<svg width="220" height="48" viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mulia Code" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Wordmark for light backgrounds. "Mulia" in ink, "Code" in toska —
       the interactive accent, since Code is the part of the name that
       does the acting. Inter Semibold, -3% tracking.
       Production note: convert text to outlines before shipping as a
       final brand asset, so it renders identically without Inter installed. -->
  <rect x="2" y="7" width="34" height="34" rx="7.5" fill="#E5B653"/>
  <path d="M11 30V16l8 8 8-8v14" fill="none" stroke="#0C0B0A"
        stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="32" font-family="Inter, -apple-system, 'Segoe UI', sans-serif"
        font-weight="600" font-size="25" letter-spacing="-0.75" fill="#0C0B0A">Mulia<tspan fill="#0F766E">Code</tspan></text>
</svg>
